<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOYO — платформа индустрии событий</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/moyo.css?v=23">
<style>
/* главная: закулисье и зал, разрезанные по диагонали; прожектор проявляет фото */
.home{position:relative;height:100vh;min-height:860px;overflow:hidden;background:#05040A}
.top{position:absolute;left:0;right:0;top:26px;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.top img{height:22px}
.top .r{display:flex;align-items:center;gap:10px}
.top .mgr{font-size:13px;color:var(--text-2);margin-right:8px;text-align:right;line-height:1.35}
.top .mgr b{display:block;color:var(--text);font-weight:600}

.hm-ph{position:absolute;inset:0;background-size:cover;transition:filter .8s var(--ease)}
.hm-a{background-image:url(assets/img/hero-hall.jpg);background-position:0% 50%;clip-path:inset(0 50% 0 0)}
.hm-b{background-image:url(assets/img/hero-backstage.jpg);background-position:100% 35%;clip-path:inset(0 0 0 50%)}
.home.on-l .hm-b,.home.on-r .hm-a{filter:brightness(.28) saturate(.4)}
.home.on-l .hm-a,.home.on-r .hm-b{filter:brightness(1.15) saturate(1.1)}
.hm-dim{position:absolute;inset:0;z-index:2;pointer-events:none;background:rgba(5,4,9,.62);-webkit-mask-image:radial-gradient(circle at var(--sx,50%) var(--sy,50%),transparent 0,transparent 170px,#000 430px);mask-image:radial-gradient(circle at var(--sx,50%) var(--sy,50%),transparent 0,transparent 170px,#000 430px)}
.hm-shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(5,4,9,.75),transparent 28%,transparent 55%,rgba(5,4,9,.85))}
.hm-seam{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.hm-seam line{stroke:rgba(220,213,242,.7);stroke-width:1.5;filter:drop-shadow(0 0 8px var(--accent))}
.hm-seam circle{fill:var(--lime);filter:drop-shadow(0 0 10px var(--lime))}
.home .spot{z-index:5}

.hd{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);z-index:8;pointer-events:none;text-align:center;white-space:nowrap}
.hd h1{font-size:84px;font-weight:600;letter-spacing:-.058em;line-height:.94;margin:20px 0 0;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.hd .label{display:inline-flex;align-items:center;gap:10px;margin-top:26px;color:var(--text-2)}
.hd .label i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime-glow)}

.roles{position:absolute;left:0;right:0;bottom:12%;z-index:9;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
.role{justify-self:center;pointer-events:auto;position:relative;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px 0 22px;border-radius:99px;font-size:16px;font-weight:600;letter-spacing:-.01em;color:#fff;white-space:nowrap;background:rgba(20,15,32,.5);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .45s var(--ease),border-color .45s,transform .5s var(--ease),box-shadow .5s}
.role::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime-glow);flex:none}
.role:hover,.role.big{background:var(--accent-fill);border-color:var(--accent-fill);box-shadow:0 12px 34px -16px var(--accent-glow)}
.hm-half{position:absolute;top:0;bottom:0;width:50%;z-index:7;cursor:pointer}
.hm-half.l{left:0}.hm-half.r{right:0}

.foot{position:absolute;left:0;right:0;bottom:26px;z-index:9}
.foot .wrap{display:flex;justify-content:space-between;padding:0 24px}
</style>
<link rel="stylesheet" href="assets/mobile.css?v=31">
</head>
<body>
<main class="home" id="home">
  <header class="top"><div class="wrap">
    <img src="assets/logo.svg" alt="MOYO">
    <div class="r">
      <div class="mgr"><b>Менеджер на связи</b>9:00–18:00 МСК</div>
      <a class="ibtn" href="#" aria-label="Telegram"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 4 3 11l6 2 2 6 3-4 5 4 2-15Z"/><path d="m9 13 8-6"/></svg></a>
      <a class="btn btn-g btn-s" href="#" data-auth="login">Войти</a>
      <a class="btn btn-p btn-s" href="#" data-auth="signup">Регистрация</a>
    </div>
  </div></header>

  <div class="hm-ph hm-a"></div><div class="hm-ph hm-b"></div>
  <div class="hm-dim" id="hmDim"></div><div class="hm-shade"></div>
  <svg class="hm-seam" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="50" y1="0" x2="50" y2="100" vector-effect="non-scaling-stroke"/></svg>
  <a class="hm-half l" href="zakazchik.html" data-r="l" aria-label="Я заказчик"></a><a class="hm-half r" href="ispolnitel.html" data-r="r" aria-label="Я исполнитель"></a>
  
  <div class="hd">
    <span class="chip"><i></i>MOYO — платформа индустрии событий</span>
    <h1>Здесь <span class="acc">притягиваются</span><br>нужные люди</h1>
  </div>

  <div class="roles">
    <a class="role" href="zakazchik.html" data-r="l">Я&nbsp;заказчик</a>
    <a class="role" href="ispolnitel.html" data-r="r">Я&nbsp;исполнитель</a>
  </div>
</main>

<script src="assets/field.js?v=23"></script>
<script src="assets/illus.js?v=23"></script>
<script src="assets/auth.js?v=23"></script>
<script>
const home=document.getElementById('home'),roles=[...document.querySelectorAll('.role')],dim=document.getElementById('hmDim');
const center=el=>{const a=el.getBoundingClientRect(),b=home.getBoundingClientRect();return[a.left-b.left+a.width/2,a.top-b.top+a.height*.42]};
// прожектор ходит между закулисьем и залом; там, где луч, фото проявляется в цвете
const spot=MoyoSpot(home,{fx:.5,spread:22,points:(W,H)=>[[W*.25,H*.45],[W*.5,H*.35],[W*.75,H*.5],[W*.5,H*.35]]});
let hovered=null,mouse=null;
home.addEventListener('pointermove',e=>{const b=home.getBoundingClientRect();mouse=[e.clientX-b.left,e.clientY-b.top]});
home.addEventListener('pointerleave',()=>mouse=null);
const halves=[...document.querySelectorAll('.hm-half')];
const pick=side=>{hovered=side?roles.find(r=>r.dataset.r===side):null;home.classList.toggle('on-l',side==='l');home.classList.toggle('on-r',side==='r');
  if(side){const b=home.getBoundingClientRect();spot.aim(side==='l'?b.width*.25:b.width*.75,b.height*.45)}else spot.free()};
[...roles,...halves].forEach(el=>{el.addEventListener('mouseenter',()=>pick(el.dataset.r));el.addEventListener('mouseleave',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-r="'+el.dataset.r+'"]'))pick(null)})});
let lx=innerWidth/2,ly=innerHeight/2;
(function lit(){
  // курсор тоже светит: если мышь на экране, пятно света идёт за ней
  const [sx,sy]=hovered||!mouse?spot.pos:mouse;
  lx+=(sx-lx)*.12;ly+=(sy-ly)*.12;
  dim.style.setProperty('--sx',lx+'px');dim.style.setProperty('--sy',ly+'px');
  roles.forEach(r=>{const [x,y]=center(r);r.classList.toggle('lit',Math.hypot(lx-x,ly-y)<180);r.classList.toggle('big',r===hovered)});
  requestAnimationFrame(lit);
})();
</script>
<script src="assets/life.js?v=23"></script>
</body>
</html>
